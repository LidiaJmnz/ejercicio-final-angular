<mat-card [class.destacado]="post().destacado">
  <mat-card-header>
    <mat-card-title>{{ post().titulo }}</mat-card-title>
    <mat-card-subtitle>{{ post().fecha | date: 'short' }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ post().descripcion }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="primary" (click)="editar.emit(post().id)">Editar</button>
    <button mat-button color="warn" (click)="eliminar.emit(post().id)">Eliminar</button>
    <button mat-button (click)="destacar.emit(post().id)">
      {{ post().destacado ? 'Quitar destacado' : 'Destacar' }}
    </button>
  </mat-card-actions>
</mat-card>
